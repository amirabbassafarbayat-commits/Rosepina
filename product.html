
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بافت یقه‌اسکی مردانه | ROSEPINA</title>
  <link rel="stylesheet" href="style.css">

  <style>
    body {
      background: #f7f6f2;
      color: #222;
      font-family: Vazirmatn, sans-serif;
      margin: 0;
    }

    .product-page {
      max-width: 1100px;
      margin: 50px auto;
      padding: 20px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 45px;
    }

    .product-photo img {
      width: 100%;
      display: block;
      border-radius: 8px;
    }

    .product-details {
      padding: 25px 0;
    }

    .product-details h1 {
      font-size: 32px;
    }

    .category {
      color: #888;
      letter-spacing: 2px;
      font-size: 12px;
    }

    .colors {
      display: flex;
      gap: 14px;
      margin: 15px 0;
    }

    .color-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 2px solid #bbb;
      cursor: pointer;
    }

    .color-btn.active {
      outline: 2px solid #222;
      outline-offset: 4px;
    }

    .old-price {
      color: #999;
      text-decoration: line-through;
    }

    .new-price {
      font-size: 27px;
      color: #a52a2a;
      font-weight: bold;
    }

    .order-btn {
      display: block;
      background: #171713;
      color: white;
      text-align: center;
      text-decoration: none;
      padding: 17px;
      margin-top: 30px;
      border-radius: 3px;
    }

    .back-link {
      display: inline-block;
      margin: 25px;
      color: #333;
      text-decoration: none;
    }

    @media(max-width:700px) {
      .product-page {
        grid-template-columns: 1fr;
        margin: 10px auto;
        gap: 15px;
      }

      .product-details h1 {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

<a href="index.html" class="back-link">← بازگشت به ROSEPINA</a>

<main class="product-page">

  <div class="product-photo">
    <img id="mainImage"
         src="sweater-charcoal.jpg"
         alt="بافت یقه‌اسکی مردانه زغالی">
  </div>

  <div class="product-details">

    <span class="category">MEN / KNITWEAR</span>

    <h1>بافت یقه‌اسکی مردانه</h1>

    <p>بافت یقه‌اسکی با طراحی شیک و استایل خاص ROSEPINA.</p>

    <h3>انتخاب رنگ:</h3>

    <div class="colors">
      <button class="color-btn active"
        style="background:#343434"
        onclick="changeColor('charcoal',this)"
        aria-label="زغالی"></button>

      <button class="color-btn"
        style="background:#80502f"
        onclick="changeColor('brown',this)"
        aria-label="قهوه‌ای"></button>

      <button class="color-btn"
        style="background:#080808"
        onclick="changeColor('black',this)"
        aria-label="مشکی"></button>

      <button class="color-btn"
        style="background:#34382b"
        onclick="changeColor('olive',this)"
        aria-label="سبز زیتونی"></button>
    </div>

    <p id="selectedColor">رنگ انتخابی: زغالی</p>

    <p>سایز: فری‌سایز</p>

    <p class="old-price">۵,۸۰۰,۰۰۰ تومان</p>
    <p class="new-price">۳,۰۰۰,۰۰۰ تومان</p>
    <p style="color:#a52a2a">۴۸٪ تخفیف</p>

    <a id="orderButton"
       class="order-btn"
       href="#"
       target="_blank"
       rel="noopener">
       ثبت سفارش در واتساپ
    </a>

  </div>
</main>

<script>
  const phone = "989120193510";
  let selectedColor = "زغالی";

  const images = {
    charcoal: "sweater-charcoal.jpg",
    brown: "sweater-brown.jpg",
    black: "sweater-black.jpg",
    olive: "sweater-olive.jpg"
  };

  const names = {
    charcoal: "زغالی",
    brown: "قهوه‌ای",
    black: "مشکی",
    olive: "سبز زیتونی"
  };

  function changeColor(color, button) {
    document.getElementById("mainImage").src = images[color];
    selectedColor = names[color];

    document.getElementById("selectedColor").textContent =
      "رنگ انتخابی: " + selectedColor;

    document.querySelectorAll(".color-btn").forEach(btn => {
      btn.classList.remove("active");
    });

    button.classList.add("active");
  }

  document.getElementById("orderButton").addEventListener("click", function(e) {
    e.preventDefault();

    const message =
      "سلام، برای سفارش بافت یقه‌اسکی مردانه ROSEPINA پیام می‌دهم.\n" +
      "رنگ: " + selectedColor + "\n" +
      "سایز: فری‌سایز\n" +
      "قیمت: ۳,۰۰۰,۰۰۰ تومان";

    const url = "https://wa.me/" + phone +
      "?text=" + encodeURIComponent(message);

    window.open(url, "_blank");
  });
</script>

</body>
</html>
